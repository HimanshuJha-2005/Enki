<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enki — Citizen Flood Map for India</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { padding: 12px 16px; background: #0b3d5c; color: #fff; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; font-size: 13px; opacity: 0.85; }
    #layout { display: grid; grid-template-columns: 2fr 1fr; gap: 0; height: calc(100vh - 64px); }
    #map { min-height: 400px; }
    #panel { padding: 16px; overflow-y: auto; border-left: 1px solid #ddd; }
    #panel h2 { font-size: 15px; margin: 12px 0 8px; }
    input, select, button { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; }
    button { background: #0b3d5c; color: #fff; border: 0; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .hint { font-size: 12px; color: #555; }
    @media (max-width: 800px) { #layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Enki — Citizen Flood Map for India</h1>
    <p>Report flood / waterlogging / leak / dry-tap. Click map to set location.</p>
  </header>
  <div id="layout">
    <div id="map"></div>
    <div id="panel">
      <h2>Filter</h2>
      <input id="f-pincode" placeholder="Pincode e.g. 110001" maxlength="6" />
      <select id="f-type">
        <option value="">All types</option>
        <option value="flood">flood</option>
        <option value="waterlogging">waterlogging</option>
        <option value="leak">leak</option>
        <option value="dry-tap">dry-tap</option>
      </select>
      <button id="f-apply">Apply</button>
      <h2>Report</h2>
      <input id="r-lat" placeholder="Lat (click map)" readonly />
      <input id="r-lng" placeholder="Lng (click map)" readonly />
      <input id="r-pincode" placeholder="Pincode (6 digits)" maxlength="6" />
      <select id="r-type">
        <option value="flood">flood</option>
        <option value="waterlogging">waterlogging</option>
        <option value="leak">leak</option>
        <option value="dry-tap">dry-tap</option>
      </select>
      <select id="r-severity">
        <option value="2">severity 2 - ankle</option>
        <option value="3" selected>severity 3 - knee</option>
        <option value="4">severity 4 - waist</option>
        <option value="5">severity 5 - dangerous</option>
      </select>
      <input id="r-photo" type="file" accept="image/jpeg,image/png,image/webp" />
      <button id="r-submit">Submit report</button>
      <p class="hint" id="status"></p>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
